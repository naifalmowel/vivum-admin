name: vivum_dashboard
description: "Vivum Admin Dashboard"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Navigation & Routing
  go_router: ^14.2.0
  
  # Firebase
  firebase_core: ^3.2.0
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.1.0
  
  # Supabase
  supabase_flutter: ^2.5.5
  
  # UI & Animations
  flutter_animate: ^4.5.0
  icons_plus:
  google_fonts: ^6.2.1
  
  # Utilities
  file_picker: ^8.0.7
  intl: ^0.19.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
